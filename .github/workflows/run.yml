name: Ejecutar scraper MEFF

permissions:
  contents: write

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4 pandas

      - name: Ejecutar script
        env:
          EMAIL_ORIGEN: ${{ secrets.EMAIL_ORIGEN }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          PASSWORD_APP: ${{ secrets.PASSWORD_APP }}
        run: python meff_opciones.py

      - name: Commit y push datos
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/*.csv data/*.json data/*.txt || true
          git diff --cached --quiet || git commit -m "datos actualizados $(date +'%Y-%m-%d')"
          # Push con hasta 3 intentos: si GitHub falla de forma puntual
          # (p. ej. "fatal error in commit_refs"), espera, rebasa y reintenta.
          for intento in 1 2 3; do
            if git push; then
              echo "Push correcto en el intento $intento"
              exit 0
            fi
            echo "Push fallido (intento $intento). Reintentando en $((intento * 20)) s..."
            sleep $((intento * 20))
            git pull --rebase origin main || true
          done
          echo "Push fallido tras 3 intentos"
          exit 1
